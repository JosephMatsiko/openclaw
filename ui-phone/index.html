<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Chuck</title>
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/m/manifest.json" />
    <meta name="theme-color" content="#0e1015" />
    <meta name="application-name" content="Chuck" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chuck" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root {
        --bg: #0e1015;
        --bg-elevated: #191c24;
        --card: #161920;
        --border: #1e2028;
        --border-strong: #2e3040;
        --text: #d4d4d8;
        --text-strong: #f4f4f5;
        --muted: #838387;
        --accent: #ff5c5c;
        --accent-subtle: rgba(255, 92, 92, 0.1);
        --ok: #22c55e;
        --warn: #eab308;
        --bubble-me: #2e3040;
        --bubble-them: #13151b;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        min-height: 100dvh;
        overflow-x: hidden;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 400 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Helvetica Neue", sans-serif;
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <chuck-app></chuck-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
